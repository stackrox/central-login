name: E2E

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '0 5 * * 0'

env:
  # StackRox internal certificate for central is issued for this name.
  ROX_INTERNAL_CENTRAL_NAME: 'central.stackrox'

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for the central-login action which we will test.
    steps:
      - uses: actions/checkout@v7

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - uses: actions/checkout@v7
        with:
          repository: stackrox/stackrox
          path: stackrox
          # We need the following for `make tag` to work. Previously it wasn't needed, because the operator bundle wasn't required/pulled.
          # Fetching 'latest' tag for the stackrox images simply worked.
          # For the operator bundle we need a proper image tag, i.e. a resolved version of 'latest'.
          fetch-depth: 0
          fetch-tags: true

      # TODO(ROX-37886): Remove this and rely on stackrox/stackrox's scripts/roxie.sh instead.
      - name: Install roxie
        uses: stackrox/actions/roxie/install-cli@bcda9b2d6d2b644c267e699479656973e84ef7fa # ratchet:stackrox/actions@v1
        with:
          version: v0.4.17
          gh-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Stackrox
        run: |
          envrc_file="$(mktemp)"
          cd stackrox
          roxie deploy central \
            --envrc "$envrc_file" \
            --resources tiny \
            --set roxie.imageRegistry=quay.io/stackrox-io \
            --set central.namespace=stackrox \
            --set central.spec.scannerV4.scannerComponent=Disabled
          source "$envrc_file"

          echo "::add-mask::$ROX_ADMIN_PASSWORD"

          # Split on last colon. ROX_ENDPOINT is expected to be of the form "<host>:<port>".
          export ROX_CENTRAL_HOST="${ROX_ENDPOINT%:*}"
          export ROX_CENTRAL_PORT="${ROX_ENDPOINT##*:}"

          env | grep "^ROX_" >> $GITHUB_ENV

      - name: Add machine to machine configuration in Central
        run: |
          curl \
            --cacert "$ROX_CA_CERT_FILE" \
            --resolve "${ROX_INTERNAL_CENTRAL_NAME}:${ROX_CENTRAL_PORT}:${ROX_CENTRAL_HOST}" \
            -u admin:${ROX_ADMIN_PASSWORD} \
          https://${ROX_INTERNAL_CENTRAL_NAME}:${ROX_CENTRAL_PORT}/v1/auth/m2m \
          -d \
          '{
            "config": {
              "type": "GITHUB_ACTIONS",
              "audience": "central.stackrox.io",
              "tokenExpirationDuration": "5m",
              "mappings": [
                {
                  "key": "sub",
                  "valueExpression": "repo:stackrox/central-login.*",
                  "role": "Analyst"
                }
              ]
            }
          }'

      - name: Run central-login action
        uses: ./
        with:
          audience: central.stackrox.io
          endpoint: ${{ env.ROX_BASE_URL }}

      - name: Install roxctl
        uses: stackrox/roxctl-installer-action@v1
        with:
          central-endpoint: ${{ env.ROX_BASE_URL }}
          central-token: ${{ env.ROX_API_TOKEN }}
          skip-tls-verify: true # The action doesn't support providing certs. Doing the whole update-tls dance just for this seems unnecessary.

      - name: Check the current user with roxctl
        run: |
          unset ROX_ADMIN_PASSWORD # Otherwise roxctl will be confused about which authentication method to use.
          roxctl central whoami
